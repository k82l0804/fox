services:
  gitlab:
    image: gitlab/gitlab-ce:${GITLAB_VERSION:-latest}
    container_name: fox-gitlab-ce
    restart: unless-stopped
    hostname: localhost
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:-http://localhost:8929}'
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-2222}
        puma['worker_processes'] = ${GITLAB_PUMA_WORKERS:-2}
        puma['min_threads'] = ${GITLAB_PUMA_MIN_THREADS:-1}
        puma['max_threads'] = ${GITLAB_PUMA_MAX_THREADS:-4}
        sidekiq['concurrency'] = ${GITLAB_SIDEKIQ_CONCURRENCY:-5}
        prometheus_monitoring['enable'] = false
        gitlab_rails['env'] = {
          'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000'
        }
    ports:
      - "${GITLAB_HTTP_PORT:-8929}:${GITLAB_HTTP_PORT:-8929}"
      - "${GITLAB_SSH_PORT:-2222}:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    shm_size: '256m'
    healthcheck:
      test: ["CMD-SHELL", "curl -f -k http://localhost:${GITLAB_HTTP_PORT:-8929}/-/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  gitlab_config:
    name: fox_gitlab_config
  gitlab_logs:
    name: fox_gitlab_logs
  gitlab_data:
    name: fox_gitlab_data
